trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: 'Set up Python 3.14'
    inputs:
      versionSpec: '3.14'
      architecture: 'x64'

  - task: PipAuthenticate@1
    displayName: 'Authenticate Azure Artifacts'
    inputs:
      artifactFeeds: 'security-ai-python'

  - script: |
      python -m pip install \
        --disable-pip-version-check \
        --retries 5 \
        --timeout 120 \
        -r requirements-dev.txt
    displayName: 'Install dependencies'

  - script: |
      ruff check .
    displayName: 'Run Ruff lint'

  - script: |
      pytest -v
    displayName: 'Run unit tests'

  - script: |
      bandit -q -r app
    displayName: 'Run Bandit security scan'

  - script: |
      pip-audit -r requirements-dev.txt
    displayName: 'Run dependency vulnerability scan'

  - script: |
      docker build -t ai-security-platform:azure-ci .
    displayName: 'Build Docker image'
