
trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: 'Set up Python 3.14'
    inputs:
      versionSpec: '3.14'
      architecture: 'x64'

  - script: |
      echo "===== CHECK PYPI CONNECTIVITY ====="
      curl -fIsS --connect-timeout 20 --max-time 60 https://pypi.org/simple/fastapi/

      echo "===== INSTALL DEPENDENCIES FROM PUBLIC PYPI ====="
      python -m pip install \
        --index-url https://pypi.org/simple \
        --disable-pip-version-check \
        --retries 5 \
        --timeout 120 \
        --no-cache-dir \
        -r requirements-dev.txt
    displayName: 'Install dependencies from public PyPI'

  - script: |
      ruff check .
    displayName: 'Run Ruff lint'

  - script: |
      pytest -v
    displayName: 'Run unit tests'

  - script: |
      bandit -q -r app
    displayName: 'Run Bandit security scan'

  - script: |
      pip-audit -r requirements-dev.txt
    displayName: 'Run dependency vulnerability scan'

  - script: |
      docker build -t ai-security-platform:azure-ci .
    displayName: 'Build Docker image'
